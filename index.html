<!DOCTYPE html>
<html>
<head>
<title>LOGINPAGE</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

body {
  /* The image used */
  background: url("shop.jpeg");

  /* Center and scale the background image */
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;

  /* Make the background responsive */
  min-height: 100vh;
  width: 100%;
  margin: 0;

  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

/* Heading */
h1 {
  text-align: center;
  padding: 20px 10px;
}

/* Full-width input fields */
input[type=text],
input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* Set a style for all buttons */
button {
  background-color: gray;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.8;
}

/* Extra styles for the cancel button */
.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

/* Center the image and position the close button */
.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
  position: relative;
}

.avatar {
  width: 100px;
  max-width: 100%;
  height: auto;
}

.container {
  padding: 16px;
}

span.psw {
  float: right;
  padding-top: 16px;
}

/* The Modal background */
.modal {
  background: url("m.gif");
  background-size: cover;
  background-position: center;

  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;

  width: 100%;
  height: 100%;
  overflow: auto;

  background-color: rgba(0,0,0,0.4);
  padding-top: 60px;
}

/* Modal Content/Box */
.modal-content {
  background: url("coffee.gif");
  background-size: cover;
  background-position: center;

  margin: 5% auto 15% auto;
  border: 1px solid #888;
  width: 30%;
}

/* The Close Button */
.close {
  position: absolute;
  right: 25px;
  top: 0;
  color: red;
  font-size: 35px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: gray;
  cursor: pointer;
}

/* Add Zoom Animation */
.animate {
  animation: animatezoom 0.6s;
}

@keyframes animatezoom {
  from {
    transform: scale(0);
  }

  to {
    transform: scale(1);
  }
}

/* Responsive design for tablets */
@media screen and (max-width: 768px) {
  body {
    background-size: cover;
    background-position: center;
  }

  .modal-content {
    width: 70%;
  }

  h1 {
    font-size: 28px;
  }
}

/* Responsive design for mobile phones */
@media screen and (max-width: 480px) {
  .modal {
    padding-top: 20px;
  }

  .modal-content {
    width: 90%;
    margin: 5% auto;
  }

  .container {
    padding: 12px;
  }

  h1 {
    font-size: 24px;
  }

  .imgcontainer {
    margin: 15px 0 10px 0;
  }

  .avatar {
    width: 80px;
  }

  span.psw {
    display: block;
    float: none;
    padding-top: 16px;
  }

  .cancelbtn {
    width: 100%;
  }
}
</style>
</head>

<body>

<h1>Beanisaya Coffee Shop</h1>

<button
  onclick="document.getElementById('id01').style.display='block'"
  style="width:auto;">
  Login
</button>

<div class="nav">
  <a href="homepage.html"></a>
</div>

<div id="id01" class="modal">

  <form class="modal-content animate" onsubmit="return validateForm()">

    <div class="imgcontainer">

      <span
        onclick="document.getElementById('id01').style.display='none'"
        class="close"
        title="Close Modal">
        &times;
      </span>

      <img src="man.png" alt="Avatar" class="avatar">

    </div>

    <div class="container">

      <label for="username"><b>Username</b></label>

      <input
        type="text"
        id="username"
        placeholder="Your Username"
        name="uname"
        required>

      <label for="password"><b>Password</b></label>

      <input
        type="password"
        id="password"
        placeholder="Your Password"
        name="psw"
        required>

      <button type="submit">Login</button>

      <label>
        <input type="checkbox" checked="checked" name="remember">
        Remember me
      </label>

    </div>

    <div class="container" style="background-color:#f1f1f1">

      <button
        type="button"
        onclick="document.getElementById('id01').style.display='none'"
        class="cancelbtn">
        Cancel
      </button>

      <span class="psw">
        Forgot <a href="#">password?</a>
      </span>

    </div>

  </form>
</div>

<script>
function validateForm() {

  var username = document.getElementById("username").value;
  var password = document.getElementById("password").value;

  var validUsername = "ron";
  var validPassword = "rondy";

  if (username === validUsername && password === validPassword) {

    window.location.href = "homepage.html";
    return false;

  } else {

    alert("Invalid Username or password");
    return false;

  }
}
</script>

</body>
</html>
